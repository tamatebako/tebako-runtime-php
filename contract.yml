# Bootstrap <-> runtime contract version: the versioned protocol between
# the tebako bootstrap (released from tamatebako/tebako) and the runtime
# images published from this repo — the env vars passed down, the argv
# layout, and the filesystem-image handoff. Modeled on
# tebako-runtime-python's contract.yml (itself tebako-runtime-ruby's);
# the version -> semantics changelog table is spec 06's, the contract-2
# grammar is spec 17's.
#
# This factory has NO contract-1 era: php runtimes exist only in the
# image era, so contract_version is 2 from the first build (the schema
# floors it at 2 — contract 1 was the retired v1 C++ tebako-main.cpp
# grammar this factory never ships). Bump rules mirror the other
# factories': any change to env/argv/handoff semantics bumps the integer
# by exactly +1, here and in the consumed driver's compiled-in
# TEBAKO_CONTRACT_VERSION, in the same commit — scripts/check_contract.rb
# locks the two (the driver-source parity arm reads the pinned
# link_unit_release's crates/tebako-driver/src/lib.rs).
#
# Schema: schema/contract.schema.yml (validated by the same check).
---
contract_version: 2

# The toolchain CONTAINER line the POSIX legs run inside:
# ghcr.io/tamatebako/tpkg-builder-<triplet>:<container_version>, baked by
# tebako-ci-containers. This factory never references the archived v1
# tebako-<platform> images. "v1" is the moving family tag; the immutable
# side is container_digests below.
container_version: "v1"

# The immutable side of the container line (the ruby#381 idiom, born
# pinned here): the ghcr manifest digest per (container x arch), recorded
# at pin time. ghcr tags are MUTABLE, so container_version alone never
# pins the toolchain — the preflight job proves recorded == live (the
# registry's Docker-Content-Digest header) before any leg spends compute,
# and the container legs pull name:tag@digest. A deliberate toolchain
# bump edits the tag above AND the digests here in the same commit. Read
# the live digest with ghcr's anonymous-token flow:
#   token=$(curl -fsSL "https://ghcr.io/token?scope=repository:tamatebako/tpkg-builder-<triplet>:pull" | jq -r .token)
#   curl -fsSL -o /dev/null -D - -H "Authorization: Bearer $token" \
#     -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
#     "https://ghcr.io/v2/tamatebako/tpkg-builder-<triplet>/manifests/<tag>" | grep -i docker-content-digest
container_digests:
  tpkg-builder-x86_64-linux-gnu:
    amd64: "sha256:76d9822a4cdeb63d1b4081161c76a511ac50ecf40efd7c9820fe18c07225193d"
  tpkg-builder-x86_64-linux-musl:
    amd64: "sha256:92b952976a36c7ef6cde9a0609549e0dbb3ef304cd79bf4caef3c19f9cb1b185"
  tpkg-builder-aarch64-linux-musl:
    arm64: "sha256:a3461eb41f5f9f6eeb79536da92ac0d4de09c14703bbb9290789418f7bc0cffb"

# The published link-unit pin: the tamatebako/tebako release whose
# prebuilt link unit (the spec-17 driver + scoped tfs + the native
# closure, per triplet) the legs CONSUME as a download instead of
# building from source, and whose tfs CLI packs the env image. The
# closure depends on the triplet and the product release only — never on
# the php version. An empty pin, a missing asset, or a checksum MISMATCH
# are all hard named errors — never a silent fallback (this factory has
# no source-build path for the driver stack; a supply-chain event is
# reported, not worked around).
#
# v2.8.66 is tebako-runtime-python's current pin (verified 2026-11-22:
# the release ships link-unit-<ver>-linux-gnu-x86_64.tar.gz): the v2.8
# driver line plus the raw-syscall interposition pair (tebako#935/#937) —
# v2.8.66's forward is the syscall INSTRUCTION itself (no libc symbol, no
# allocation, no loader lock), the fix whose absence wedged the gnu legs
# at first intercepted call. Contract unchanged (2).
link_unit_release: "v2.8.66"

# The macOS support floor (tebako-runtime-python#81's pin, same value):
# stamped into the exe's LC_BUILD_VERSION minos on the macos legs via
# MACOSX_DEPLOYMENT_TARGET (PhpBuild#floor_env) and asserted at the
# provenance gate (ci/check_symbol_provenance.sh's minos arm) — a product
# decision, never the runner image's accident.
macos_deployment_target: "14.0"

# The release machinery pin: tamatebako/tebako-release-tooling is the
# single owner of the publish/sign/audit machinery (ecosystem invariant
# 10); the Gemfile reads THIS value (one contract edit bumps the pin,
# never a second hand-written copy). The factory's identity + policy ride
# scripts/release_adapter.rb — the repo carries no copy of the machinery.
# v0.5.1 is tebako-runtime-python's proven pin.
release_tooling: "v0.5.1"

# The php version catalog this factory builds (and will publish, once the
# publish increment lands). The SOURCE PINS (url/sha256 per version) live
# in versions.yml — there is no tamatebako source factory for php yet, so
# this factory fetches php.net's release tarballs directly; check_contract
# locks catalog <=> versions.yml (a version in one but not the other is a
# config bug).
#
# Set grammar (tebako-runtime-ruby's semantics, via the python factory):
#   catalog — every version this factory builds
#   full    — the tip of every supported line
#   tidy    — the primary smoke set
php:
  catalog: ["8.4.28"]
  full: ["8.4.28"]
  tidy: ["8.4.28"]
