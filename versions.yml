# Supported upstream php versions. There is NO tamatebako source factory
# for php yet (the census increment builds from pristine upstream): the
# legs download php.net's published release tarballs directly, so THIS
# file is the source-pin trust anchor — the sha256 recorded beside each
# url, verified at fetch time (a mismatch is a hard error, never a
# refetch). The grammar mirrors tamatebako/ruby's versions.yml (the
# source-factory shape this factory will flow from if a tamatebako/php
# source factory ever opens).
#
# contract.yml's php.catalog selects which of these pinned versions the
# matrix builds; scripts/check_contract.rb locks the two (a catalog
# version with no pin, or a pin the catalog never builds, is a config
# bug).
---
versions:
  "8.4.28":
    url: https://www.php.net/distributions/php-8.4.28.tar.gz
    sha256: deffc88c60fcfb99f683a9f6689e9c91cf41b7cba50bd5f01a232a98c27f2cd4
    line: "8.4"
