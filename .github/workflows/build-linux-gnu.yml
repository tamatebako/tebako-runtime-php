# The linux-gnu build workflow — the skeleton's ONE platform leg
# (tebako-runtime-python's _build-platform.yml role, collapsed into a
# single workflow: the reusable-workflow split across build-<platform>.yml
# triggers arrives with the second platform). Stages:
#
#   1. compute   — the contract gate (schema + catalog/pin cross-lock +
#                  the driver-source parity arm, scripts/check_contract.rb)
#                  runs, then scripts/compute_matrix.rb expands THIS
#                  platform's legs under the dispatch filters. Every
#                  downstream value flows from these outputs — workflow
#                  YAML never hardcodes a version, a tag, or a SHA
#                  (ecosystem SSOT invariant).
#   2. preflight — the container digest pin (ruby#381's idiom, born
#                  pinned here): contract.yml's container_digests must
#                  match the registry's CURRENT digest for the tag before
#                  any leg spends compute; the legs then pull
#                  name:tag@digest, so the toolchain container can never
#                  move under the matrix.
#   3. build     — one leg per (php x arch) of this platform:
#                  tools/build_runtime -> ci/check_symbol_provenance.sh ->
#                  tools/boot_smoke -> the runtime-packages-<os>-<arch>-<php>
#                  artifact. The build scripts fetch and sha256-verify
#                  every input themselves (the pinned source tarball off
#                  versions.yml, the pinned link unit, the tfs CLI) — there
#                  is NO source-build path for the driver stack here
#                  (contract.yml's link_unit_release comment).
#
# Container grammar (the python factory's): the linux legs run on the
# ubuntu host and docker-run the tpkg-builder image per step (the musl
# image is alpine-based and node actions cannot run on musl, so the
# job-level container: form is out — here, and when musl arrives).
#
# The cache holds ONLY the sha256-verified downloads (.build/downloads)
# and the staged link unit (.build/link-unit): a restored entry re-verifies
# against the pins on use, so a poisoned or stale cache cannot survive a
# pin bump (the key also carries the pins' hashes). save-always: a red
# boot smoke must never tax the next leg a cold re-download (the ruby
# factory's msys campaign lesson). CACHE_VER stays the manual escape
# hatch.
name: build-linux-gnu

on:
  push:
    branches: [main]
    # A docs-only change cannot change a build's outcome (tebako#866).
    paths-ignore:
      - "**/*.md"
  pull_request:
  workflow_dispatch:
    inputs:
      php_filter:
        description: 'phps: "full", "tidy", "catalog", or comma-separated versions'
        type: string
        default: 'full'
      arch_filter:
        description: 'Arch slice: "all" or an arch (x86_64 | arm64)'
        type: string
        default: 'all'

# One run per branch/PR-head at a time: pushing to a branch with an open
# PR would otherwise run every job twice (push + pull_request events);
# a new run cancels the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CACHE_VER: 1

jobs:
  compute:
    name: Compute the linux-gnu legs
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.emit.outputs.run }}
      leg_count: ${{ steps.emit.outputs.leg_count }}
      legs: ${{ steps.emit.outputs.legs }}
      tebako_version: ${{ steps.emit.outputs.tebako_version }}
      container_version: ${{ steps.emit.outputs.container_version }}
      container_digests: ${{ steps.emit.outputs.container_digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # The contract gate first: contract.yml against its schema, the
      # catalog resolvable AND cross-locked to versions.yml's source pins,
      # AND the driver-source parity arm (the pinned link-unit release's
      # TEBAKO_CONTRACT_VERSION vs contract_version) — fail-closed.
      - name: validate the contract
        run: bundle exec scripts/check_contract.rb

      - id: emit
        env:
          PHP_FILTER: ${{ inputs.php_filter || 'full' }}
          PLATFORM_FILTER: linux-gnu
          ARCH_FILTER: ${{ inputs.arch_filter || 'all' }}
        run: |
          set -euo pipefail
          legs=$(scripts/compute_matrix.rb)
          count=$(jq '.include | length' <<< "$legs")
          {
            echo "legs=$legs"
            echo "leg_count=$count"
            if [ "$count" -gt 0 ]; then echo "run=true"; else echo "run=false"; fi
            echo "tebako_version=$(cat VERSION)"
            echo "container_version=$(scripts/versions --pin container_version)"
            echo "container_digests=$(ruby -ryaml -rjson -e '
              d = YAML.load_file("contract.yml")["container_digests"]
              abort("contract.yml declares no container_digests") if d.nil? || d.empty?
              print JSON.generate(d)
            ')"
          } >> "$GITHUB_OUTPUT"
          # Mirror the plan to the LOG: values written only to
          # $GITHUB_OUTPUT leave no diagnosable record when the legs skip.
          echo "plan (linux-gnu): $count legs (php=${PHP_FILTER} arch=${ARCH_FILTER})"
          jq -r '.include[] | "  \(.php) \(.os)/\(.arch) on \(.host)"' <<< "$legs"

  preflight:
    name: Verify the toolchain container digest
    needs: compute
    if: ${{ needs.compute.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify every referenced container manifest exists at its recorded digest
        env:
          LEGS: ${{ needs.compute.outputs.legs }}
          CONTAINER_VERSION: ${{ needs.compute.outputs.container_version }}
          CONTAINER_DIGESTS: ${{ needs.compute.outputs.container_digests }}
        run: |
          set -u
          names=$(printf '%s' "$LEGS" | jq -r '.include[].container // empty' | sed 's/:[^:]*$//' | sort -u)
          [ -n "$names" ] || { echo "no containerized legs; nothing to preflight"; exit 0; }
          missing=0
          for ref in $names; do
            c="${ref#ghcr.io/tamatebako/}"
            for arch in amd64 arm64; do
              recorded=$(printf '%s' "$CONTAINER_DIGESTS" | jq -r --arg c "$c" --arg a "$arch" '.[$c][$a] // empty')
              # A per-triplet tpkg-builder image carries ONE arch; the
              # skeleton's legs are x86_64, so only the amd64 record is
              # required. (The multi-arch form arrives with the arm64
              # leg's increment.)
              [ "$arch" = "amd64" ] || continue
              if [ -z "$recorded" ]; then
                echo "::error::contract.yml container_digests records no digest for $c/$arch — record the published digest there"
                missing=1
                continue
              fi
              # ghcr's anonymous-token flow (no docker login on this job):
              # the manifest GET's Docker-Content-Digest header is the
              # registry's CURRENT digest for the tag — a retagged image
              # (a toolchain move under an unchanged tag) shows here.
              token=$(curl -fsSL "https://ghcr.io/token?scope=repository:tamatebako/${c}:pull" | jq -r .token) || token=
              live=$(curl -fsSL -o /dev/null -D - \
                -H "Authorization: Bearer ${token}" \
                -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
                "https://ghcr.io/v2/tamatebako/${c}/manifests/${CONTAINER_VERSION}" \
                | tr -d '\r' | sed -n 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: //p') || live=
              if [ -z "$live" ]; then
                echo "::error::missing toolchain container: ${ref}:${CONTAINER_VERSION}"
                missing=1
              elif [ "$live" != "$recorded" ]; then
                echo "::error::${ref}:${CONTAINER_VERSION} moved: recorded $recorded, live $live — a retagged toolchain container under an unchanged tag; repin contract.yml container_digests only as a reviewed toolchain bump"
                missing=1
              else
                echo "ok: ${ref}:${CONTAINER_VERSION} @ $live"
              fi
            done
          done
          [ "$missing" -eq 0 ] || { echo "::error::preflight failed — publish the containers or fix container_version/container_digests in contract.yml"; exit 1; }

  build:
    name: ${{ matrix.php }} / ${{ matrix.os }}-${{ matrix.arch }}
    needs: [compute, preflight]
    # An unguarded empty matrix poisons the run conclusion.
    if: ${{ needs.compute.outputs.run == 'true' }}
    runs-on: ${{ matrix.host }}
    # A hung leg fails loudly at the cap, never silently (the ruby
    # factory's 150-minute record is the reference).
    timeout-minutes: 150
    # build_runtime's release-digest fetches ride the GitHub API;
    # unauthenticated calls share the runner NAT's 60/h budget and die on
    # 403 flakes. secrets.GITHUB_TOKEN raises the budget to 5000/h; the
    # container leg forwards it via -e below.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute.outputs.legs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create folder for runtime packages
        run: mkdir -p runtime-packages

      - name: Cache the verified downloads + the staged link unit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/downloads
            .build/link-unit
          key: tebako-php-dl-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('contract.yml', 'versions.yml') }}-v${{ env.CACHE_VER }}
          save-always: true

      # --- build (the container leg: docker-run the digest-pinned
      # tpkg-builder image per step — the preflight proved the pin) ------
      - name: Build the runtime (container leg)
        env:
          CONTAINER_DIGESTS: ${{ needs.compute.outputs.container_digests }}
        run: |
          set -euo pipefail
          c="${{ matrix.container }}"
          name="${c%:*}"
          digest=$(printf '%s' "$CONTAINER_DIGESTS" | jq -r --arg c "${name#ghcr.io/tamatebako/}" '.[$c].amd64 // empty')
          [ -n "$digest" ] || { echo "::error::no recorded container digest for $name/amd64"; exit 1; }
          image="${c}@${digest}"
          echo "Building in $image"
          docker run --rm -e GITHUB_TOKEN \
            -v "${{ github.workspace }}:/mnt/w" -w /mnt/w \
            "$image" bash -c '
              set -e
              tools/build_runtime --php "${{ matrix.php }}"
              ci/check_symbol_provenance.sh --exe \
                "runtime-packages/tebako-runtime-${{ needs.compute.outputs.tebako_version }}-php-${{ matrix.php }}-${{ matrix.host_id }}"
              export TEBAKO_RUNTIME_ROOT=runtime-packages
              TEBAKO_TFS=$(echo .build/downloads/tfs/*/tfs-*)
              export TEBAKO_TFS
              tools/boot_smoke
              # Root in the container writes root-owned files onto the
              # bind mount; hand them back to the runner user so the host
              # steps (cache save, artifact upload) can read/write them.
              uid=$(stat -c %u /mnt/w/contract.yml); gid=$(stat -c %g /mnt/w/contract.yml)
              chown -R "$uid:$gid" /mnt/w/.build /mnt/w/runtime-packages 2>/dev/null || true'

      # The leg's workspace as the run's evidence: the exe + env image +
      # sidecars the leg built and the boot smoke proved.
      - name: Upload the runtime packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-packages-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.php }}
          path: runtime-packages

  # The terminal aggregate — and the branch-protection gate. The build
  # legs are a dynamic matrix whose check names shift with the catalog
  # (a version bump renames every leg), so protection pins this job's
  # stable check name instead of any leg's.
  verify:
    name: all legs green
    needs: [compute, preflight, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on the legs
        run: |
          set -euo pipefail
          echo "compute:   ${{ needs.compute.result }} (run=${{ needs.compute.outputs.run }}, legs=${{ needs.compute.outputs.leg_count }})"
          echo "preflight: ${{ needs.preflight.result }}"
          echo "build:     ${{ needs.build.result }}"
          if [ "${{ needs.compute.result }}" != "success" ]; then
            echo "::error::the contract/matrix computation failed"
            exit 1
          fi
          if [ "${{ needs.compute.outputs.run }}" = "true" ] && [ "${{ needs.preflight.result }}" != "success" ]; then
            echo "::error::the container preflight failed: ${{ needs.preflight.result }}"
            exit 1
          fi
          if [ "${{ needs.compute.outputs.run }}" = "true" ] && [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::not every linux-gnu leg succeeded: ${{ needs.build.result }}"
            exit 1
          fi
